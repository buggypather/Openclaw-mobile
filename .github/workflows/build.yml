name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build installable Android debug APK
        working-directory: android
        run: gradle :app:assembleDebug

      - name: Report APK size
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          BYTES=$(stat -c%s "$APK")
          MIB=$(awk "BEGIN { printf \"%.2f\", $BYTES/1048576 }")
          echo "Android debug APK: $APK"
          echo "### Android APK size: ${MIB} MiB (${BYTES} bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
